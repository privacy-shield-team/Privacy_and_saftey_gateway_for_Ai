# Port — uses $PORT from Render, falls back to 8080 locally
server.port=${PORT:8080}

# H2 Database — in-memory for cloud, file-based locally
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:privacy_shield;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AI Provider Configuration (Default to mock mode if not configured)
ai.gateway.provider=${AI_PROVIDER:mock}
ai.gateway.openai.api-key=${OPENAI_API_KEY:}
ai.gateway.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.gateway.gemini.api-key=${GEMINI_API_KEY:}
ai.gateway.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Google OAuth2 (Set via env vars or through in-app gateway configuration)
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/oauth2/callback}

# Cloudflare Turnstile CAPTCHA (Defaults to Cloudflare official test keys for localhost development)
captcha.turnstile.site-key=${TURNSTILE_SITE_KEY:1x00000000000000000000AA}
captcha.turnstile.secret-key=${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
captcha.turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
