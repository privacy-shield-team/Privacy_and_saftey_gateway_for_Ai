server.port=8080

# H2 Database configuration
spring.datasource.url=jdbc:h2:file:./data/privacy_shield;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AI Provider Configuration (Default to mock mode if not configured)
ai.gateway.provider=${AI_PROVIDER:mock}
ai.gateway.openai.api-key=${OPENAI_API_KEY:}
ai.gateway.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.gateway.gemini.api-key=${GEMINI_API_KEY:}
ai.gateway.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
